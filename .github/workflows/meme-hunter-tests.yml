name: Meme Coin Hunter Offline Tests
on:
  push:
    paths:
      - '.agents/skills/meme-coin-hunter-architect/**'
      - '.github/workflows/meme-hunter-tests.yml'
  pull_request:
    paths:
      - '.agents/skills/meme-coin-hunter-architect/**'
      - '.github/workflows/meme-hunter-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate offline security, shadow and execution modules
        run: python -m unittest discover -s .agents/skills/meme-coin-hunter-architect/tests -p 'test_*.py' -v
